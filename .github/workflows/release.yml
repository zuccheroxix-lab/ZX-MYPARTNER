name: Build & Release APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p releases release
          cp app/build/outputs/apk/debug/app-debug.apk releases/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk releases/DYNIMETIZE_ZX-v2.2.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk releases/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk releases/DYNIMETIZE_ZX-v2.2.0-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk release/DYNIMETIZE_ZX-v2.2.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk release/DYNIMETIZE_ZX-v2.2.0-release.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DYNIMETIZE_ZX-v2.2.0-debug
          path: releases/DYNIMETIZE_ZX-v2.2.0-debug.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DYNIMETIZE_ZX-v2.2.0-release
          path: releases/DYNIMETIZE_ZX-v2.2.0-release.apk

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.2.0' }}
          name: DYNIMETIZE ZX ${{ github.ref_type == 'tag' && github.ref_name || 'v2.2.0' }}
          files: |
            releases/DYNIMETIZE_ZX-v2.2.0-release.apk
            releases/DYNIMETIZE_ZX-v2.2.0-debug.apk
            releases/app-release.apk
            releases/app-debug.apk
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
